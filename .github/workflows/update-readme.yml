name: Update coding challenge log

on:
  # 로컬 훅을 사용할 수 없는 환경에서만 수동으로 실행하는 복구용 작업입니다.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README
        env:
          TZ: Asia/Seoul
        run: python3 scripts/update_readme.py

      - name: Commit changed log
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update coding challenge log [skip ci]"
          git push
